<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#fafaf9">
  <meta name="description" content="A little German, every day. Practise German A1–A2 vocabulary and grammar by topic, from everyday phrases to past tenses and cases.">
  <title>Deutsch — daily practice</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Vocab">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.mjs"></script>
</head>
<body>
  <header class="app-header">
    <div class="mode-picker">
      <button id="app-mode" class="filter-button" type="button" aria-label="Topic: Nouns" aria-haspopup="dialog" aria-expanded="false" aria-controls="mode-menu">
        <span class="filter-label">Nouns</span><svg class="filter-chevron" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 4.5 3 3 3-3"/></svg>
      </button>
      <div id="mode-menu" class="choice-popover" role="dialog" aria-label="Choose a topic" hidden>
        <div class="picker-tools">
          <label class="sr-only" for="topic-search">Search topics</label>
          <input id="topic-search" class="topic-search" type="search" placeholder="Search topics…" autocomplete="off" aria-controls="mode-options">
          <div class="level-picker" role="group" aria-label="Vocabulary level">
            <button type="button" data-level="all" aria-pressed="true">A1–A2</button>
            <button type="button" data-level="A1" aria-pressed="false">A1</button>
            <button type="button" data-level="A2" aria-pressed="false">A2</button>
          </div>
        </div>
        <div id="mode-options" class="mode-options" role="menu" aria-label="Topics"></div>
      </div>
    </div>
    <button id="theme-toggle" class="icon-button" type="button" aria-label="Switch to dark theme"><span class="theme-icon" aria-hidden="true"></span></button>
  </header>
  <main class="practice-shell">
    <section id="practice" class="study-card" aria-label="German practice"></section>
    <p id="storage-error" class="storage-error" role="status" hidden>Progress couldn’t be saved in this browser.</p>
  </main>
  <footer class="app-footer"><span>Made with love for Alex, the love of my life. <span class="ascii-heart" aria-label="heart">&lt;3</span></span></footer>
  <noscript>This vocabulary app needs JavaScript to run.</noscript>
  <canvas id="session-confetti" class="session-confetti" aria-hidden="true"></canvas>
</body>
</html>
